<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Egyedi X2 Blocks - Mentéssel</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        h1 { margin-bottom: 10px; }
        
        /* Kontroll gombok */
        .menu { margin-bottom: 20px; display: flex; gap: 10px; }
        button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; background: #444; color: white; }
        .btn-reset { background: #8b0000; }
        
        #score-board { font-size: 20px; margin-bottom: 10px; color: #ffcc00; font-weight: bold; }

        #game-container { position: relative; width: 350px; height: 500px; background: #333; border: 5px solid #444; overflow: hidden; display: flex; }
        .column { flex: 1; border-right: 1px solid #444; position: relative; cursor: pointer; display: flex; flex-direction: column-reverse; }
        .column:last-child { border-right: none; }
        
        .block { width: 100%; height: 70px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1px solid rgba(0,0,0,0.2); font-size: 14px; color: #000; box-sizing: border-box; animation: drop 0.2s ease-out; }
        @keyframes drop { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        
        #next-label { margin-top: 10px; }
        #next-block { margin-top: 5px; width: 70px; height: 70px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; border: 3px solid #fff; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>Custom Merge Blocks</h1>
    
    <div id="score-board">Pontszám: 0</div>

    <div class="menu">
        <button onclick="saveGame()">Mentés</button>
        <button onclick="loadGame()">Betöltés</button>
        <button class="btn-reset" onclick="resetGame()">Új játék</button>
    </div>

    <div id="next-label">Következő blokk:</div>
    <div id="next-block"></div>

    <div id="game-container">
        <div class="column" onclick="shoot(0)"></div>
        <div class="column" onclick="shoot(1)"></div>
        <div class="column" onclick="shoot(2)"></div>
        <div class="column" onclick="shoot(3)"></div>
        <div class="column" onclick="shoot(4)"></div>
    </div>

    <script>
        // PONTOSAN AZ EREDETI SZÍNEK ÉS ÉRTÉKEK
        const config = [
            { v: "128B", c: "#FFC0CB" }, { v: "256B", c: "#808080" }, { v: "513B", c: "#ADD8E6" },
            { v: "1T", c: "#FFFF00" }, { v: "2T", c: "#FFA500" }, { v: "4T", c: "#00008B" },
            { v: "8T", c: "#90EE90" }, { v: "16T", c: "#A52A2A" }, { v: "32T", c: "#CCBB00" },
            { v: "64T", c: "#D8BFD8" }, { v: "128T", c: "#FF0000" }, { v: "257T", c: "#F0FFFF" },
            { v: "514T", c: "#00008B" }, { v: "1Q", c: "#FFB6C1" }
        ];

        let columns = [[], [], [], [], []];
        let nextIndex = 0;
        let score = 0;

        function updateNext() {
            nextIndex = Math.floor(Math.random() * 4); 
            const nextEl = document.getElementById('next-block');
            nextEl.innerText = config[nextIndex].v;
            nextEl.style.backgroundColor = config[nextIndex].c;
            // Eredeti fehér betűszín logika
            nextEl.style.color = (config[nextIndex].v === "4T" || config[nextIndex].v === "514T") ? "#fff" : "#000";
        }

        function render() {
            document.getElementById('score-board').innerText = "Pontszám: " + score;
            const colElements = document.querySelectorAll('.column');
            colElements.forEach((colEl, i) => {
                colEl.innerHTML = '';
                columns[i].forEach(valIndex => {
                    const block = document.createElement('div');
                    block.className = 'block';
                    block.innerText = config[valIndex].v;
                    block.style.backgroundColor = config[valIndex].c;
                    if(config[valIndex].v === "4T" || config[valIndex].v === "514T") block.style.color = "#fff";
                    colEl.appendChild(block);
                });
            });
        }

        function shoot(col) {
            if(columns[col].length >= 7) return; // Ne lógjon ki a pályáról
            columns[col].push(nextIndex);
            checkMerge(col);
            updateNext();
            render();
            autoSave(); // Minden lépés után elmentjük a háttérben
        }

        function checkMerge(col) {
            let colData = columns[col];
            if (colData.length < 2) return;
            if (colData[colData.length - 1] === colData[colData.length - 2]) {
                let last = colData.pop();
                if(last < config.length - 1) {
                    colData[colData.length - 1] = last + 1;
                    score += (last + 2) * 10; // Jutalom pont az egyesülésért
                    checkMerge(col);
                }
            }
        }

        // --- MENTÉS FUNKCIÓK ---
        function autoSave() {
            const data = { columns, score, nextIndex };
            localStorage.setItem('mati_x2_save', JSON.stringify(data));
        }

        function saveGame() {
            autoSave();
            alert("Játék állapota elmentve!");
        }

        function loadGame() {
            const saved = localStorage.getItem('mati_x2_save');
            if(saved) {
                const data = JSON.parse(saved);
                columns = data.columns;
                score = data.score;
                nextIndex = data.nextIndex;
                render();
                // Frissítsük a következő blokk kijelzőjét is a betöltöttre
                const nextEl = document.getElementById('next-block');
                nextEl.innerText = config[nextIndex].v;
                nextEl.style.backgroundColor = config[nextIndex].c;
                nextEl.style.color = (config[nextIndex].v === "4T" || config[nextIndex].v === "514T") ? "#fff" : "#000";
            } else {
                alert("Nincs mentett játék.");
            }
        }

        function resetGame() {
            if(confirm("Biztosan törlöd a jelenlegi állást és új pályát kezdesz?")) {
                columns = [[], [], [], [], []];
                score = 0;
                localStorage.removeItem('mati_x2_save');
                updateNext();
                render();
            }
        }

        // Indításkor megnézzük, van-e mentés
        const initialLoad = localStorage.getItem('mati_x2_save');
        if(initialLoad) {
            loadGame();
        } else {
            updateNext();
            render();
        }
    </script>
</body>
</html>
