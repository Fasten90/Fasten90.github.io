<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>X2 Blocks - Végtelen Mód v0.81</title>
    <style>
        /* ==========================================================================
           ALAPVETŐ OLDALBEÁLLÍTÁSOK ÉS STÍLUSOK (BASIC PAGE STYLING)
           ========================================================================== */
        body { 
            background: #1a1a1a; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            padding: 10px; 
        }

        /* Felső menüsor konténer (Mentés, Betöltés, Új játék gombok elhelyezése) */
        .menu { 
            margin-bottom: 15px; 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            justify-content: center; 
        }

        /* Általános gomb stílusok a menühöz */
        button { 
            padding: 8px 12px; 
            cursor: pointer; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            background: #444; 
            color: white; 
            font-size: 12px; 
        }

        /* Új játék gomb egyedi, figyelemfelkeltő piros színe */
        .btn-reset { background: #8b0000; }

        /* Pontszám és verziószám kijelző sáv a képernyő tetején */
        #score-board { 
            font-size: 18px; 
            margin-bottom: 10px; 
            color: #ffcc00; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }

        /* Kis szürke verzió felirat a pontszám mellett (v0.81) */
        .version-tag { 
            font-size: 12px; 
            color: #888; 
            font-weight: normal; 
        }

        /* ==========================================================================
           JÁTÉKTÉR ÉS BLOKKOK VIZUÁLIS MEGJELENÍTÉSE (GAME BOARD & BLOCKS)
           ========================================================================== */
           
        /* A játéktér kerete (320px széles, 450px magas, sötét háttérrel) */
        #game-container { 
            position: relative; 
            width: 320px; 
            height: 450px; 
            background: #333; 
            border: 4px solid #444; 
            display: flex; 
        }

        /* A játék 5 oszlopa. Alulról felfelé építkeznek a flex-direction: column-reverse miatt */
        .column { 
            flex: 1; 
            border-right: 1px solid #444; 
            display: flex; 
            flex-direction: column-reverse; 
            height: 100%; 
            overflow: hidden; 
        }
        .column:last-child { border-right: none; }

        /* Egyetlen játékkocka/blokk általános stílusa */
        .block { 
            width: 100%; 
            min-height: 10px; 
            flex: 1; 
            max-height: 60px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            border: 1px solid rgba(0,0,0,0.2); 
            font-size: clamp(10px, 3vw, 14px); 
            box-sizing: border-box; 
            animation: drop 0.15s ease-out; /* Finom leeső animáció bedobáskor */
        }

        /* Speciális formázás: a számokban előforduló '0' (nulla) áthúzása */
        .zero-strike {
            text-decoration: line-through;
            display: inline-block;
        }

        /* Leesési animáció definíciója */
        @keyframes drop { 
            from { transform: translateY(-50%); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }

        /* A következő kilőhető kocka előnézeti konténere */
        #next-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin-bottom: 10px; 
        }
        #next-block { 
            width: 60px; 
            height: 60px; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            border: 3px solid #fff; 
        }

        /* ==========================================================================
           REKORDVÁLTÓ FEHÉR FELUGRÓ ABLAK (MODAL DIALOG STYLING)
           ========================================================================== */
           
        /* Sötétített háttér az ablak mögött */
        #modal-overlay {
            display: none; /* Alapból rejtve van, csak rekordváltáskor kapcsol be */
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        /* A kis fehér kártya/doboz a képernyő közepén */
        #modal-box {
            background: #ffffff;
            color: #000000;
            padding: 20px;
            border-radius: 12px;
            width: 230px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* A felugró ablakban lévő interaktív szöveg stílusa */
        #modal-text {
            font-size: 16px;
            font-weight: bold;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* A felugró ablak "OK" gombja */
        #modal-btn {
            padding: 8px 20px;
            font-size: 14px;
            font-weight: bold;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #modal-btn:hover { background: #218838; }
    </style>
</head>
<body>

    <!-- Pontszám és Verziószám fejléc -->
    <div id="score-board">
        <span>Pont: <span id="score-val">0</span></span>
        <span class="version-tag">v0.81</span>
    </div>

    <!-- Játékon belüli főmenü gombjai -->
    <div class="menu">
        <button onclick="saveGame()">Mentés</button>
        <button onclick="loadGame()">Betöltés</button>
        <button class="btn-reset" onclick="resetGame()">Új játék</button>
    </div>

    <!-- Következő kilövésre váró blokk kijelzése -->
    <div id="next-container">
        <div style="font-size: 14px; margin-bottom: 5px;">Következő:</div>
        <div id="next-block"></div>
    </div>

    <!-- A játék 5 kattintható oszlopa (itt történik a blokkok lövése) -->
    <div id="game-container">
        <div class="column" onclick="shoot(0)"></div>
        <div class="column" onclick="shoot(1)"></div>
        <div class="column" onclick="shoot(2)"></div>
        <div class="column" onclick="shoot(3)"></div>
        <div class="column" onclick="shoot(4)"></div>
    </div>

    <!-- Rekordváltáskor megjelenő 3 lépéses felugró ablak -->
    <div id="modal-overlay">
        <div id="modal-box">
            <div id="modal-text"></div>
            <button id="modal-btn" onclick="advanceModal()">OK</button>
        </div>
    </div>

    <script>
        /* ==========================================================================
           MÁTI X2 BLOCKS - FEJLESZTÉSI ÉS KÓDOLÁSI SZABÁLYOK (DEVELOPMENT GUIDELINES)
           ==========================================================================
           1. KOMMENTEK SZIGORÚ MEGŐRZÉSE: Minden egyes függvény, változó és logikai 
              lépés részletesen fel van kommentelve magyarul ÉS angolul. Tilos a korábbi 
              magyarázó megjegyzések törlése! Új funkcióknál csak bővíteni szabad.
           2. VERZIÓZÁS ÉS KÖVETHETŐSÉG: Jelenlegi verzió: v0.81. Minden újabb szám 
              vagy logikai változtatás esetén frissíteni kell a verziószámot.
           3. VISSZAFELE ÉS JÖVŐBELE KOMPATIBILITÁS: A mentési rendszer szöveges alapon
              ('stringColumns') tárolja a blokkokat. Ez biztosítja, hogy a jövőbeli 
              frissítések során (v0.9, v1.0) új számok beszúrásakor se csússzanak el 
              a játékos meglévő mentései.
           4. VIZUÁLIS SPECIÁLITÁSOK: A 'formatZero()' segédfüggvény automatikusan 
              áthúzza a számokban előforduló összes '0' (nulla) karaktert.
           5. BEÉPÍTETT HANGEFFEKTEK: A Web Audio API segítségével külső fájlok nélkül,
              programozottan generálódnak a halk kattintó és pattanó hangok.
           ========================================================================== */

        /* ==========================================================================
           1. BEÁLLÍTÁSOK ÉS SZÁM-TÁBLÁZAT (CONFIG - v0.81)
           Itt található az összes blokk értéke (v) és háttérszíne (c) sorrendben.
           ========================================================================== */
        const config = [
            { v: "128B", c: "#FFC0CB" }, // Index 0
            { v: "256B", c: "#808080" }, // Index 1
            { v: "513B", c: "#ADD8E6" }, // Index 2
            { v: "1T",   c: "#FFFF00" }, // Index 3
            { v: "2T",   c: "#FFA500" }, // Index 4
            { v: "4T",   c: "#00008B" }, // Index 5
            { v: "8T",   c: "#90EE90" }, // Index 6
            { v: "16T",  c: "#A52A2A" }, // Index 7
            { v: "32T",  c: "#CCBB00" }, // Index 8  (32T küszöb, innen indul a rekordváltó üzenet)
            { v: "64T",  c: "#D8BFD8" }, // Index 9
            { v: "128T", c: "#FF0000" }, // Index 10
            { v: "257T", c: "#F0FFFF" }, // Index 11
            { v: "514T", c: "#00008B" }, // Index 12
            { v: "1Q",   c: "#FFB6C1" }, // Index 13
            { v: "2Q",   c: "#808080" }, // Index 14 (256B színe)
            { v: "4Q",   c: "#ADD8E6" }, // Index 15 (513B színe)
            { v: "8Q",   c: "#FFFF00" }, // Index 16 (1T színe)
            { v: "16Q",  c: "#FFA500" }, // Index 17 (2T színe)
            { v: "32Q",  c: "#00008B" }, // Index 18 (4T színe)
            { v: "64Q",  c: "#90EE90" }, // Index 19 (8T színe)
            { v: "129Q", c: "#A52A2A" }, // Index 20 (16T színe)
            { v: "258Q", c: "#CCBB00" }, // Index 21 (32T színe)
            { v: "516Q", c: "#D8BFD8" }, // Index 22 (64T színe)
            { v: "1U",   c: "#FF0000" }, // Index 23 (128T színe)
            { v: "2U",   c: "#F0FFFF" }, // Index 24 (257T színe)
            { v: "4U",   c: "#00008B" }, // Index 25 (514T színe)
            { v: "6U",   c: "#FFB6C1" }, // Index 26 (1Q színe)
            { v: "8U",   c: "#808080" }, // Index 27 (2Q színe)
            { v: "16U",  c: "#ADD8E6" }, // Index 28 (4Q színe)
            { v: "32U",  c: "#FFFF00" }, // Index 29 (8Q színe)
            { v: "65U",  c: "#FFA500" }, // Index 30 (16Q színe)
            { v: "130U", c: "#00008B" }, // Index 31 (32Q színe)
            { v: "260U", c: "#90EE90" }, // Index 32 (64Q színe)
            { v: "520U", c: "#A52A2A" }, // Index 33 (129Q színe)
            { v: "1O",   c: "#A52A2A" }, // Index 34 (129Q színén)
            { v: "2O",   c: "#CCBB00" }, // Index 35 (258Q színén)
            { v: "4O",   c: "#D8BFD8" }, // Index 36 (516Q színén)
            { v: "8O",   c: "#FF0000" }, // Index 37 (1U színén)
            { v: "16O",  c: "#F0FFFF" }, // Index 38 (2U színén)
            { v: "33O",  c: "#00008B" }, // Index 39 (4U színén)
            { v: "66O",  c: "#808080" }, // Index 40 (8U színén)
            { v: "133O", c: "#ADD8E6" }, // Index 41 (16U színén)
            { v: "266O", c: "#FFFF00" }, // Index 42 (32U színén)
            { v: "533O", c: "#FFA500" }, // Index 43 (65U színén)
            { v: "1I",   c: "#00008B" }, // Index 44 (130U színén)
            { v: "2I",   c: "#90EE90" }, // Index 45 (260U színén)
            { v: "4I",   c: "#A52A2A" }, // Index 46 (520U színén)
            { v: "8I",   c: "#A52A2A" }, // Index 47 (1O színén)
            { v: "17I",  c: "#CCBB00" }, // Index 48 (2O színén)
            { v: "34I",  c: "#D8BFD8" }, // Index 49 (4O színén)
            { v: "∞",    c: "#CCBB00" }  // Index 50 (Végtelen jel, 258Q / 2O színével)
        ];

        /* Mentési kulcsok a böngésző helyi tárhelyéhez (localStorage) */
        const SAVE_KEY = 'mati_x2_universal_save'; // Univerzális, jövőálló mentési kulcs
        const LEGACY_KEYS = ['mati_x2_v5', 'mati_x2_v4', 'mati_x2_v3']; // Régi tesztverziók kulcsai a migrációhoz

        /* ==========================================================================
           2. JÁTÉK ÁLLAPOT VÁLTOZÓI (GAME STATE VARIABLES)
           ========================================================================== */
        let columns = [[], [], [], [], []]; // A 5 játéktéri oszlop adatai (blokkok indexei)
        let nextIndex = 0;                  // A fentről következően kilőhető blokk indexe
        let score = 0;                      // Játékos aktuális pontszáma
        let maxRecord = 0;                  // Az eddig elért legmagasabb blokk indexe a pályán
        
        let minSpawn = 0;                   // A sorsolható alsó blokk index határ
        let maxSpawn = 3;                   // A sorsolható felső blokk index határ
        let recordBrokenThisTurn = false;   // Logikai kapcsoló: jelzi, ha ebben a körben rekord dőlt

        /* ==========================================================================
           3. HANGEFFEKTEK KEZELÉSE (WEB AUDIO API SOUND SYSTEM)
           ========================================================================== */
        let audioCtx = null;

        /**
         * Inicializálja az AudioContext-et. A böngésző biztonsági irányelvei miatt
         * ez kizárólag az első felhasználói interakció (kattintás) után indulhat el.
         */
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        /**
         * Klikk szerű halk hang összevonódáskor (magasabb, tiszta frekvenciájú tónus).
         */
        function playClickSound() {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime); // Nagyon halk hangerő
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch(e) {}
        }

        /**
         * "K" betű szerű / tompa pattanó halk hang blokk leesésekor vagy kilövésekor.
         */
        function playDropSound() {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime); // Nagyon halk hangerő
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.06);
            } catch(e) {}
        }

        /* ==========================================================================
           4. SEGÉDFÜGGVÉNYEK ÉS LOGIKAI VEZÉRLŐK (HELPER FUNCTIONS)
           ========================================================================== */

        /**
         * Segédfüggvény: Ha a blokk szövegében '0' (nulla) számjegy található,
         * azt automatikusan áthúzza (line-through), ahogyan a felhasználó kérte.
         */
        function formatZero(text) {
            if (!text) return '';
            return text.toString().replace(/0/g, '<span class="zero-strike">0</span>');
        }

        /**
         * Intelligens betűszín-választó: kiszámolja a háttérszín (hex) világosságát,
         * és fekete vagy fehér szövegszínt ad vissza a tökéletes olvashatóságért.
         */
        function getTextColor(hex) {
            if (!hex) return '#000';
            hex = hex.replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness < 130 ? '#ffffff' : '#000000';
        }

        /**
         * Kiszámolja a pályán lévő legnagyobb blokk értéke alapján, hogy mi lehet 
         * a legkisebb és legnagyobb újonnan sorsolható szám (dinamikus nehézség).
         */
        function updateSpawnRange() {
            let maxFound = 0;
            columns.forEach(col => col.forEach(val => {
                if (val > maxFound) maxFound = val;
            }));

            minSpawn = Math.max(0, maxFound - 7);
            maxSpawn = Math.max(3, maxFound - 4);
        }

        /**
         * Pályatakarító: Ha elértünk egy szintet, eltávolítja a túl kicsi számokat
         * nemcsak a következő lövések közül, hanem a teljes pályáról is.
         */
        function cleanBoard() {
            updateSpawnRange();
            columns = columns.map(col => col.filter(val => val >= minSpawn));
        }

        /**
         * Sorsol egy új „Következő” blokkot a kiszámolt minSpawn és maxSpawn határok között.
         */
        function updateNext() {
            if (minSpawn > maxSpawn) minSpawn = maxSpawn;
            nextIndex = minSpawn + Math.floor(Math.random() * (maxSpawn - minSpawn + 1)); 
            if (nextIndex >= config.length) nextIndex = config.length - 1;
            
            // Következő elem doboz frissítése (áthúzott nullákkal)
            const nextEl = document.getElementById('next-block');
            nextEl.innerHTML = config[nextIndex] ? formatZero(config[nextIndex].v) : '?';
            nextEl.style.backgroundColor = config[nextIndex] ? config[nextIndex].c : '#fff';
            nextEl.style.color = getTextColor(config[nextIndex].c);
        }

        /**
         * Kirajzolja a teljes játékteret (oszlopokat, blokkokat, pontszámot) a képernyőre.
         */
        function render() {
            document.getElementById('score-val').innerText = score;
            const colElements = document.querySelectorAll('.column');
            
            colElements.forEach((colEl, i) => {
                colEl.innerHTML = ''; // Oszlop ürítése újrarajzolás előtt
                columns[i].forEach(valIndex => {
                    const block = document.createElement('div');
                    block.className = 'block';
                    block.innerHTML = config[valIndex] ? formatZero(config[valIndex].v) : '?';
                    block.style.backgroundColor = config[valIndex] ? config[valIndex].c : '#fff';
                    block.style.color = config[valIndex] ? getTextColor(config[valIndex].c) : '#000';
                    colEl.appendChild(block);
                });
            });
        }

        /* ==========================================================================
           5. JÁTÉKMENET ÉS FÚZIÓS LOGIKA (GAMEPLAY & MERGING LOGIC)
           ========================================================================== */

        /**
         * Blokkilövés függvény: a játékos által választott oszlopba (0-4) beteszi a következőt.
         */
        function shoot(col) {
            playDropSound(); // Halk pattanó hang lejátszása lövéskor
            recordBrokenThisTurn = false;
            columns[col].push(nextIndex);
            checkMerge(col); // Összeolvadások ellenőrzése

            // Ha új rekord született, feldobjuk a fehér felugró ablakot
            if (recordBrokenThisTurn) {
                showRecordModal();
            } else {
                cleanBoard();
                updateNext();
                render();
                autoSave();
            }
        }

        /**
         * Rekurzív fúziós függvény: ellenőrzi az oszlop felső két blokkjának egyezőségét.
         * Ha azonosak, duplázza őket, pontot ad, és újraellenőrzi láncreakcióhoz.
         */
        function checkMerge(col) {
            let colData = columns[col];
            if (colData.length < 2) return;
            
            // Ha a legfelső két blokk értéke megegyezik
            if (colData[colData.length - 1] === colData[colData.length - 2]) {
                let last = colData.pop();
                
                playClickSound(); // Halk klikkelő hang lejátszása fúziónál
                
                // KÜLÖNLEGES ESET: Végtelen fúzió (∞ + ∞ = ∞)
                if (last === config.length - 1) {
                    colData[colData.length - 1] = last;
                    score += 50000; // Nagy bónuszpont végtelen találatkor
                    checkMerge(col);
                } 
                // NORMÁL ESET: Érték növelése a következő szintre
                else if (last < config.length - 1) {
                    let newIndex = last + 1;
                    colData[colData.length - 1] = newIndex;
                    score += (newIndex + 1) * 20;

                    // Ellenőrzés, hogy elérte-e a 32T-t (index 8) és új rekord-e
                    if (newIndex >= 8 && newIndex > maxRecord) {
                        maxRecord = newIndex;
                        recordBrokenThisTurn = true;
                    }

                    checkMerge(col); // Rekurzív hívás láncreakcióhoz
                }
            }
        }

        /* ==========================================================================
           6. REKORDVÁLTÓ FEHÉR ABLAK VEZÉRLÉSE (MODAL DIALOG FLOW)
           ========================================================================== */
        let modalStep = 0; // Nyomon követi a 3 lépéses párbeszéd aktuális fázisát

        // Megjeleníti az 1. lépést ("Rekordot váltottál!")
        function showRecordModal() {
            modalStep = 1;
            document.getElementById('modal-text').innerText = "Rekordot váltottál!";
            document.getElementById('modal-overlay').style.display = "flex";
        }

        // Az OK gomb megnyomására lépteti a szöveget a soron következő üzenetre
        function advanceModal() {
            if (modalStep === 1) {
                modalStep = 2;
                document.getElementById('modal-text').innerText = "Új szám jöhet!";
            } else if (modalStep === 2) {
                modalStep = 3;
                document.getElementById('modal-text').innerText = "Törlődik a legkisebb szám.";
            } else if (modalStep === 3) {
                modalStep = 0;
                document.getElementById('modal-overlay').style.display = "none"; // Bezárás
                
                // Utolsó OK után lefut a pálya tisztítása és a mentés
                cleanBoard();
                updateNext();
                render();
                autoSave();
            }
        }

        /* ==========================================================================
           7. MENTÉSI ÉS BETÖLTÉSI RENDSZER (JÖVŐÁLLÓ LOCALSTORAGE)
           ========================================================================== */

        /**
         * Automatikus mentés: Eltárolja az oszlopok indexeit ÉS a szöveges blokk-értékeket
         * ('stringColumns') is, így a jövőbeli frissítések (v0.9, v1.0) sosem rontják el a mentést.
         */
        function autoSave() {
            const stringColumns = columns.map(col => col.map(idx => config[idx] ? config[idx].v : null));

            const dataToSave = {
                version: "0.81",
                columns: columns,
                stringColumns: stringColumns, // Ez biztosítja a jövőbeli kompatibilitást!
                score: score,
                nextIndex: nextIndex,
                maxRecord: maxRecord
            };
            localStorage.setItem(SAVE_KEY, JSON.stringify(dataToSave));
        }

        // Gombnyomásra történő mentés értesítéssel
        function saveGame() { 
            autoSave(); 
            alert("Mentve!"); 
        }

        /**
         * Intelligens betöltés: Ellenőrzi az új univerzális kulcsot, ha nincs, migrálja
         * a régebbi verziók mentéseit is, hogy a játékos ne veszítse el a játékállását.
         */
        function loadGame() {
            let rawData = localStorage.getItem(SAVE_KEY);
            let legacyKeyFound = null;

            if (!rawData) {
                for (let key of LEGACY_KEYS) {
                    rawData = localStorage.getItem(key);
                    if (rawData) {
                        legacyKeyFound = key;
                        break;
                    }
                }
            }

            if (rawData) {
                try {
                    const data = JSON.parse(rawData);
                    
                    // 1. ESET: Jövőálló szöveges alapú betöltés (stringColumns)
                    if (data.stringColumns && Array.isArray(data.stringColumns)) {
                        columns = data.stringColumns.map(col => col.map(valStr => {
                            let foundIdx = config.findIndex(c => c.v === valStr);
                            return foundIdx !== -1 ? foundIdx : 0;
                        }));
                    }
                    // 2. ESET: Régebbi index-alapú mentések konvertálása
                    else if (data.columns && Array.isArray(data.columns)) {
                        columns = data.columns.map(col => col.map(idx => {
                            if (legacyKeyFound === 'mati_x2_v5' && idx === 19) return config.length - 1;
                            if (legacyKeyFound === 'mati_x2_v4' && idx === 23) return config.length - 1;
                            return Math.min(idx, config.length - 1);
                        }));
                    } else {
                        columns = [[], [], [], [], []];
                    }

                    score = data.score || 0;
                    maxRecord = data.maxRecord || 0;

                    // Maximális rekord frissítése a betöltött tábla alapján
                    columns.forEach(col => col.forEach(val => {
                        if (val > maxRecord) maxRecord = val;
                    }));

                    cleanBoard();
                    
                    if (typeof data.nextIndex === 'number' && data.nextIndex < config.length) {
                        nextIndex = data.nextIndex;
                    } else {
                        updateNext();
                    }

                    render();

                    // Következő elem kijelzőjének frissítése (áthúzott nullákkal)
                    const nextEl = document.getElementById('next-block');
                    nextEl.innerHTML = config[nextIndex] ? formatZero(config[nextIndex].v) : '?';
                    nextEl.style.backgroundColor = config[nextIndex] ? config[nextIndex].c : '#fff';
                    nextEl.style.color = config[nextIndex] ? getTextColor(config[nextIndex].c) : '#000';

                    // Ha régi kulcsból mentettük át, azonnal elmentjük az új univerzális formátumban is
                    if (legacyKeyFound) {
                        autoSave();
                    }
                } catch (e) {
                    console.error("Hiba a mentés betöltésekor:", e);
                }
            }
        }

        /**
         * Új játék indítása: figyelmeztetés után törli a mentéseket és nullázza a pályát.
         */
        function resetGame() {
            if(confirm("Új pálya?")) {
                columns = [[], [], [], [], []];
                score = 0;
                maxRecord = 0;
                minSpawn = 0;
                maxSpawn = 3;
                localStorage.removeItem(SAVE_KEY);
                LEGACY_KEYS.forEach(k => localStorage.removeItem(k));
                updateNext();
                render();
            }
        }

        /* ==========================================================================
           8. JÁTÉK INDÍTÁSA ÉS INICIALIZÁCIÓ (INITIALIZATION)
           ========================================================================== */
        loadGame();
        // Ha betöltés után üres a pálya, legeneráljuk az első elemet és kirajzoljuk
        if (columns.every(c => c.length === 0)) {
            updateNext();
            render();
        }
    </script>
</body>
</html>
