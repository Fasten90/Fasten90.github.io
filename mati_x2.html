<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>X2 Blocks Pro - Mentés Funkcióval</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; }
        .controls { margin: 20px; display: flex; gap: 10px; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; background: #444; color: white; transition: 0.3s; }
        button:hover { background: #666; }
        .btn-new { background: #d9534f; } /* Piros az új játéknak */
        
        #game-container { position: relative; width: 350px; height: 500px; background: #333; border: 5px solid #444; border-radius: 8px; overflow: hidden; display: flex; }
        .column { flex: 1; border-right: 1px solid #444; position: relative; cursor: pointer; display: flex; flex-direction: column-reverse; transition: background 0.1s; }
        .column:hover { background: rgba(255,255,255,0.05); }
        
        .block { width: 100%; height: 70px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 1px solid rgba(0,0,0,0.2); font-size: 14px; color: #000; box-sizing: border-box; animation: drop 0.2s ease-out; }
        @keyframes drop { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        
        #next-container { display: flex; align-items: center; gap: 20px; margin-bottom: 10px; }
        #next-block { width: 60px; height: 60px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; border: 3px solid #fff; }
        #score-display { font-size: 24px; font-weight: bold; color: #ffcc00; }
    </style>
</head>
<body>

    <h1>X2 Merge Blocks</h1>

    <div id="score-display">Pont: 0</div>

    <div id="next-container">
        <div>Következő:</div>
        <div id="next-block"></div>
    </div>

    <div class="controls">
        <button onclick="saveGame()">Mentés</button>
        <button onclick="loadGame()">Betöltés</button>
        <button class="btn-new" onclick="resetGame()">Új pálya</button>
    </div>

    <div id="game-container">
        <div class="column" onclick="shoot(0)"></div>
        <div class="column" onclick="shoot(1)"></div>
        <div class="column" onclick="shoot(2)"></div>
        <div class="column" onclick="shoot(3)"></div>
        <div class="column" onclick="shoot(4)"></div>
    </div>

    <script>
        const config = [
            { v: "128B", c: "#FFC0CB" }, { v: "256B", c: "#B0B0B0" }, { v: "513B", c: "#ADD8E6" },
            { v: "1T", c: "#FFFF00" }, { v: "2T", c: "#FFA500" }, { v: "4T", c: "#FF4500" },
            { v: "8T", c: "#90EE90" }, { v: "16T", c: "#32CD32" }, { v: "32T", c: "#CCBB00" },
            { v: "64T", c: "#D8BFD8" }, { v: "128T", c: "#FF0000" }, { v: "257T", c: "#F0FFFF" },
            { v: "514T", c: "#00008B" }, { v: "1Q", c: "#FFB6C1" }
        ];

        let columns = [[], [], [], [], []];
        let nextIndex = 0;
        let score = 0;

        // --- FUNKCIÓK ---

        function updateNext() {
            nextIndex = Math.floor(Math.random() * 5); // 0-4 index közötti kezdő blokkok
            const nextEl = document.getElementById('next-block');
            nextEl.innerText = config[nextIndex].v;
            nextEl.style.backgroundColor = config[nextIndex].c;
        }

        function render() {
            const colElements = document.querySelectorAll('.column');
            document.getElementById('score-display').innerText = "Pont: " + score;

            colElements.forEach((colEl, i) => {
                colEl.innerHTML = '';
                columns[i].forEach(valIndex => {
                    const block = document.createElement('div');
                    block.className = 'block';
                    block.innerText = config[valIndex].v;
                    block.style.backgroundColor = config[valIndex].c;
                    // Sötét háttérnél fehér szöveg
                    if(["4T", "514T", "16T", "00008B"].includes(config[valIndex].v)) block.style.color = "#fff";
                    colEl.appendChild(block);
                });
            });
        }

        function shoot(col) {
            if (columns[col].length >= 7) {
                alert("Az oszlop megtelt! Game Over?");
                return;
            }
            columns[col].push(nextIndex);
            checkMerge(col);
            updateNext();
            render();
            // Automatikus mentés minden lépésnél (opcionális, de biztonságos)
            saveGame(true); 
        }

        function checkMerge(col) {
            let colData = columns[col];
            if (colData.length < 2) return;

            let last = colData.length - 1;
            if (colData[last] === colData[last - 1]) {
                let valIdx = colData.pop();
                if (valIdx < config.length - 1) {
                    colData[last - 1] = valIdx + 1;
                    score += (valIdx + 1) * 10; // Pontozás
                    checkMerge(col); // Újabb ellenőrzés (láncreakció)
                }
            }
        }

        // --- MENTÉS RENDSZER ---

        function saveGame(silent = false) {
            const gameState = {
                columns: columns,
                score: score,
                nextIndex: nextIndex
            };
            localStorage.setItem('x2_save_game', JSON.stringify(gameState));
            if(!silent) alert("Játék elmentve!");
        }

        function loadGame() {
            const savedData = localStorage.getItem('x2_save_game');
            if (savedData) {
                const state = JSON.parse(savedData);
                columns = state.columns;
                score = state.score;
                nextIndex = state.nextIndex;
                render();
                // Frissítsük a vizuális "következő" blokkot is
                const nextEl = document.getElementById('next-block');
                nextEl.innerText = config[nextIndex].v;
                nextEl.style.backgroundColor = config[nextIndex].c;
                alert("Játék betöltve!");
            } else {
                alert("Nincs mentett játék!");
            }
        }

        function resetGame() {
            if(confirm("Biztosan új pályát kezdesz? Minden pontod elvész!")) {
                columns = [[], [], [], [], []];
                score = 0;
                localStorage.removeItem('x2_save_game');
                updateNext();
                render();
            }
        }

        // Kezdéskor próbálja betölteni az utolsó állapotot
        const autoLoad = localStorage.getItem('x2_save_game');
        if(autoLoad) {
            loadGame();
        } else {
            updateNext();
            render();
        }
    </script>
</body>
</html>
